
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSurvey - Waste Management Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        #boot-error {
            display: none;
            position: fixed;
            inset: 0;
            background: #fff;
            padding: 2rem;
            color: #b91c1c;
            z-index: 10000;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            overflow: auto;
        }
        .error-box {
            background: #fee2e2;
            padding: 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid #fca5a5;
            margin-top: 1rem;
            word-break: break-all;
        }
        #app-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f9fafb;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top: 3px solid #16a34a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script>
        window.process = window.process || { env: { API_KEY: "" } };
        
        function showError(title, details) {
            const loader = document.getElementById('app-loader');
            if (loader) loader.style.display = 'none';
            
            const errorDiv = document.getElementById('boot-error');
            errorDiv.style.display = 'block';
            errorDiv.innerHTML = `
                <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;">${title}</h1>
                <div class="error-box">
                    ${details}
                </div>
                <button onclick="location.reload()" style="margin-top: 2rem; background: #16a34a; color: white; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 600; border: none; cursor: pointer;">
                    Reload App
                </button>
            `;
        }

        window.onerror = function(msg, url, line, col, error) {
            showError("Application Error", `
                <strong>Message:</strong> ${msg}<br>
                <strong>Source:</strong> ${url}<br>
                <strong>Line:</strong> ${line}
            `);
            return false;
        };
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="app-loader">
        <div class="spinner"></div>
        <p style="margin-top: 1rem; font-size: 0.875rem; color: #6b7280; font-weight: 600;">Starting EcoSurvey...</p>
    </div>
    <div id="boot-error"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
